<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OBLIVION — Games</title>
  <link rel="icon" href="Icons/logo.png">

  <style>
    :root{--g1:#0a001a;--g2:#180033;--g3:#00001a;--g4:#1a0033;--acc:#b4a0ff}
    html,body{height:100%;margin:0;font-family:'Orbitron',sans-serif;background:var(--g1);color:#fff;overflow-x:hidden}
    
    /* --------  Nebula Background  -------- */
    body {
      background: url('imgs/nebula.JPG') no-repeat center center fixed;
      background-size: cover;
      padding-bottom: 80px;
    }
    
    /* --------  Header  -------- */
    .page-header {
      text-align: center;
      padding: 40px 20px 20px;
    }
    
    .page-title {
      font-size: clamp(2.5rem, 8vw, 4rem);
      letter-spacing: .15em;
      color: #fff;
      text-shadow: 0 0 20px #000, 0 0 40px #000, 0 0 60px #9664ff, 0 0 80px #64ffff;
      margin: 0;
    }
    
    .page-subtitle {
      color: #fff;
      text-shadow: 0 0 10px #000, 0 0 20px #000;
      font-size: 1.1rem;
      margin-top: 10px;
    }

    /* --------  Bottom Navigation Bar  -------- */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background: rgba(0, 0, 0, .9);
      backdrop-filter: blur(12px);
      border-top: 1px solid rgba(180, 140, 255, .5);
      box-shadow: 0 0 25px rgba(0, 0, 0, .8);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      z-index: 999;
      padding: 0 20px;
    }
    
    .bottom-nav a {
      padding: 8px 20px;
      font-size: 0.95rem;
      color: #fff;
      text-decoration: none;
      transition: .25s ease;
      border-radius: 6px;
      text-shadow: 0 0 5px #000;
    }
    
    .bottom-nav a:hover {
      color: #fff;
      text-shadow: 0 0 10px rgba(180, 140, 255, 1);
      background: rgba(255, 255, 255, .15);
    }
    
    .bottom-nav a.active {
      color: #fff;
      background: rgba(180, 140, 255, .3);
      text-shadow: 0 0 10px rgba(180, 140, 255, 1);
    }
    
    /* --------  Panic Button  -------- */
    .panic-btn {
      padding: 8px 24px;
      font-size: 0.95rem;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(90deg, #ff4444, #cc0000);
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: .25s ease;
      text-decoration: none;
      text-shadow: 0 0 5px #000;
    }
    
    .panic-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px rgba(255, 68, 68, .7);
    }
  </style>
</head>

<body>
  <header class="page-header">
    <h1 class="page-title">OBLIVION</h1>
    <p class="page-subtitle">Games — Pick your poison</p>
  </header>

  <!-- Lumin SDK container -->
  <div id="games"></div>

  <!-- =========  Bottom Navigation Bar  ========= -->
  <nav class="bottom-nav">
    <a href="index.html">Home</a>
    <a href="partners.html">Partners</a>
    <a href="games.html" class="active">Games</a>
    <a href="apps.html">Apps</a>
    <a href="about.html">About</a>
    <button class="panic-btn" onclick="panic()">PANIC</button>
  </nav>

  <!-- Lumin SDK script -->
  <script src="https://cdn.jsdelivr.net/gh/luminsdk/script@latest/lumin.min.js"></script>
  <script>
    Lumin.init({
      container: '#games',
      theme: 'dark'
    });
  </script>

  <script>
    function panic() {
      window.location.href = 'https://www.google.com';
    }
  </script>
</body>
</html>
