<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OBLIVION</title>
  <link rel="icon" href="Icons/logo.png">

  <!-- =========  CRITICAL CSS  ========= -->
  <style>
    :root{--g1:#0a001a;--g2:#180033;--g3:#00001a;--g4:#1a0033;--acc:#b4a0ff}
    html,body{height:100%}body{margin:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;font-family:'Orbitron',sans-serif;background:var(--g1);color:#fff;overflow-x:hidden}
    @keyframes f{0%,100%{opacity:1}50%{opacity:.8}}@keyframes p{to{transform:scale(1.05)}}
    
    /* --------  Nebula Background  -------- */
    body {
      background: url('imgs/nebula.JPG') no-repeat center center fixed;
      background-size: cover;
      padding-bottom: 80px;
    }
    
    /* --------  Text Visibility Fixes  -------- */
    .title {
      font-size: clamp(3rem, 10vw, 5rem);
      letter-spacing: .15em;
      color: #fff;
      text-shadow: 0 0 20px #000, 0 0 40px #000, 0 0 60px #9664ff, 0 0 80px #64ffff;
      animation: f 3s infinite, p 6s infinite alternate;
    }
    
    .desc {
      color: #fff;
      text-shadow: 0 0 10px #000, 0 0 20px #000;
      font-size: 1.1rem;
      line-height: 1.6;
    }
    
    .proxy-box {
      background: rgba(0, 0, 0, .6);
      border: 1px solid rgba(255, 255, 255, .3);
      border-radius: 12px;
      width: 90%;
      max-width: 480px;
      display: flex;
      overflow: hidden;
      margin-top: 2rem;
      backdrop-filter: blur(18px);
      box-shadow: 0 0 30px rgba(0, 0, 0, .5);
    }
    
    #uv-address {
      flex: 1;
      padding: 14px;
      color: #fff;
      background: transparent;
      border: none;
      outline: none;
      font-size: 1rem;
      text-shadow: 0 0 5px #000;
    }
    
    button {
      background: linear-gradient(90deg, #6366f1, #9333ea);
      padding: 0 24px;
      font-weight: bold;
      border: none;
      cursor: pointer;
      transition: .3s;
      color: #fff;
    }
    
    button:hover {
      transform: scale(1.05);
    }
    
    /* --------  Bottom Navigation Bar  -------- */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background: rgba(0, 0, 0, .9);
      backdrop-filter: blur(12px);
      border-top: 1px solid rgba(180, 140, 255, .5);
      box-shadow: 0 0 25px rgba(0, 0, 0, .8);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      z-index: 999;
      padding: 0 20px;
    }
    
    .bottom-nav a {
      padding: 8px 20px;
      font-size: 0.95rem;
      color: #fff;
      text-decoration: none;
      transition: .25s ease;
      border-radius: 6px;
      text-shadow: 0 0 5px #000;
    }
    
    .bottom-nav a:hover {
      color: #fff;
      text-shadow: 0 0 10px rgba(180, 140, 255, 1);
      background: rgba(255, 255, 255, .15);
    }
    
    .bottom-nav a.active {
      color: #fff;
      background: rgba(180, 140, 255, .3);
      text-shadow: 0 0 10px rgba(180, 140, 255, 1);
    }
    
    /* --------  Panic Button  -------- */
    .panic-btn {
      padding: 8px 24px;
      font-size: 0.95rem;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(90deg, #ff4444, #cc0000);
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: .25s ease;
      text-decoration: none;
      text-shadow: 0 0 5px #000;
    }
    
    .panic-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px rgba(255, 68, 68, .7);
    }
    
    /* hidden until full css loads */
    .discord-link {
      visibility: hidden;
      color: #fff;
      text-shadow: 0 0 10px #000;
    }
</style>


  <!-- async non-critical css -->
  <link rel="preload" href="styles.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="styles.min.css"></noscript>

  <!-- =========  DEFERRED SCRIPTS  ========= -->
  <script src="https://cdn.tailwindcss.com" defer></script>
  <script src="/lf.js" defer></script>
  <script src="uv/uv.bundle.js" defer></script>
  <script src="uv/uv.config.js" defer></script>
  <script src="/index.js" defer></script>
  <script src="hotkey.js" defer></script>

  <!-- =========  IDLE-LOADED TAGS  ========= -->
  <script>
    const loadWhenIdle=(src,id)=>{
      if('requestIdleCallback' in window) requestIdleCallback(()=>inject(src,id),{timeout:3000});
      else inject(src,id);
    };
    const inject=(src,id)=>{
      if(document.getElementById(id))return;
      const s=document.createElement('script');s.id=id;s.src=src;s.async=1;document.head.appendChild(s);
    };
    loadWhenIdle('https://arc.io/widget.min.js#KpYQhCTB','arc-widget');
    loadWhenIdle('https://www.googletagmanager.com/gtag/js?id=G-PWD8SS29YZ','gtag');
    window.dataLayer=window.dataLayer||[];
    function gtag(){dataLayer.push(arguments);}
    gtag('js',new Date());
    gtag('config','G-PWD8SS29YZ');
  </script>
</head>

<body>
  <h1 class="title">OBLIVION</h1>
  <p class="desc">
    The future of private browsing.<br>
    Fast, encrypted, and untraceable — powered by <span style="color:#a78bfa">Infinite Scripter</span>.
  </p>

  <form id="uv-form" class="proxy-box">
    <input type="hidden" id="uv-search-engine" value="https://www.google.com/search?q=%s">
    <input id="uv-address" type="text" placeholder="Enter a URL or search query…" required>
    <button type="submit">Go</button>
  </form>

  <a class="discord-link" href="https://discord.gg/W27wU3RFHf" target="_blank" rel="noopener">Join Our Discord</a>

  <!-- =========  Bottom Navigation Bar  ========= -->
  <nav class="bottom-nav">
    <a href="index.html" class="active">Home</a>
    <a href="partners.html">Partners</a>
    <a href="games.html">Games</a>
    <a href="apps.html">Apps</a>
    <a href="about.html">About</a>
    <button class="panic-btn" onclick="panic()">PANIC</button>
  </nav>

  <script>
    function panic() {
      window.location.href = 'https://www.google.com';
    }
  </script>
</body>
</html>
