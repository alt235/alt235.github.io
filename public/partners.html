<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oblivion • Partners</title>
  <link rel="shortcut icon" type="x-icon" href="Icons/logo.png" />
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root{--g1:#0a001a;--g2:#180033;--g3:#00001a;--g4:#1a0033;--acc:#b4a0ff}
    html,body{height:100%;margin:0;font-family:'Orbitron',sans-serif;background:var(--g1);color:#fff;overflow-x:hidden}

    /* --------  Nebula Background (matches index.html)  -------- */
    body {
      background: url('imgs/nebula.JPG') no-repeat center center fixed;
      background-size: cover;
      padding-bottom: 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 4rem;
      text-align: center;
    }

    /* --------  Title (matches index.html visibility)  -------- */
    .title {
      font-size: clamp(2.5rem, 8vw, 4rem);
      letter-spacing: .15em;
      color: #fff;
      text-shadow: 0 0 20px #000, 0 0 40px #000, 0 0 60px #9664ff, 0 0 80px #64ffff;
      margin: 0;
    }

    .page-subtitle {
      color: #fff;
      text-shadow: 0 0 10px #000, 0 0 20px #000;
      font-size: 1.1rem;
      margin-top: 10px;
    }

    /* --------  Partners Grid  -------- */
    .partners-grid {
      margin-top: 3rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 2rem;
      width: 90%;
      max-width: 1000px;
    }

    .partner-card {
      background: rgba(0, 0, 0, .7);
      border: 1px solid rgba(255, 255, 255, .2);
      backdrop-filter: blur(18px);
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 0 30px rgba(0, 0, 0, .5);
      transition: transform 0.35s ease, box-shadow 0.35s ease, border 0.35s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: white;
    }

    .partner-card:hover {
      transform: translateY(-10px);
      border: 1px solid rgba(160, 120, 255, 0.9);
      box-shadow: 
        0 0 25px rgba(160, 120, 255, 0.6),
        0 0 50px rgba(120, 220, 255, 0.4),
        0 0 80px rgba(160, 120, 255, 0.3);
    }

    .partner-card:hover .partner-logo {
      filter: drop-shadow(0 0 15px rgba(180, 140, 255, 0.9));
      transform: scale(1.05);
      transition: transform 0.25s ease, filter 0.25s ease;
    }

    .partner-logo {
      width: 80px;
      height: 80px;
      object-fit: contain;
      margin-bottom: 1rem;
      filter: drop-shadow(0 0 10px rgba(160, 120, 255, 0.8));
      transition: 0.25s ease;
    }

    .partner-name {
      font-size: 1.6rem;
      color: #fff;
      text-shadow: 0 0 10px #000;
      margin-bottom: 0.5rem;
    }

    .partner-desc {
      color: #fff;
      text-shadow: 0 0 5px #000;
      font-size: 1rem;
      line-height: 1.5;
    }

    /* --------  Bottom Navigation Bar (matches index.html)  -------- */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background: rgba(0, 0, 0, .9);
      backdrop-filter: blur(12px);
      border-top: 1px solid rgba(180, 140, 255, .5);
      box-shadow: 0 0 25px rgba(0, 0, 0, .8);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      z-index: 999;
      padding: 0 20px;
    }
    
    .bottom-nav a {
      padding: 8px 20px;
      font-size: 0.95rem;
      color: #fff;
      text-decoration: none;
      transition: .25s ease;
      border-radius: 6px;
      text-shadow: 0 0 5px #000;
    }
    
    .bottom-nav a:hover {
      color: #fff;
      text-shadow: 0 0 10px rgba(180, 140, 255, 1);
      background: rgba(255, 255, 255, .15);
    }
    
    .bottom-nav a.active {
      color: #fff;
      background: rgba(180, 140, 255, .3);
      text-shadow: 0 0 10px rgba(180, 140, 255, 1);
    }
    
    /* --------  Panic Button (matches index.html)  -------- */
    .panic-btn {
      padding: 8px 24px;
      font-size: 0.95rem;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(90deg, #ff4444, #cc0000);
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: .25s ease;
      text-decoration: none;
      text-shadow: 0 0 5px #000;
    }
    
    .panic-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px rgba(255, 68, 68, .7);
    }
  </style>
</head>

<body>
  <h1 class="title">OUR PARTNERS</h1>
  <p class="page-subtitle">The allies of Oblivion</p>

  <div class="partners-grid">

    <!-- Partner 1 -->
    <a href="put link of proxy/" target="_blank" class="partner-card">
      <img src="public/imgs/IMG" class="partner-logo" alt="Partner Logo">
      <h2 class="partner-name">No partners</h2>
      <p class="partner-desc">No partner</p>
    </a>
  </div>

  <!-- =========  Bottom Navigation Bar  ========= -->
  <nav class="bottom-nav">
    <a href="index.html">Home</a>
    <a href="public/partners.html" class="active">Partners</a>
    <a href="games.html">Games</a>
    <a href="apps.html">Apps</a>
    <a href="about.html">About</a>
    <button class="panic-btn" onclick="panic()">PANIC</button>
  </nav>

  <script>
    function panic() {
      window.location.href = 'https://www.google.com';
    }
  </script>
</body>
</html>
